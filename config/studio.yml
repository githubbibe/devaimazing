# Configuration globale devaimazing

# Modèles LLM
models:
  pm_opus: claude-opus-4-8         # Phase 1 : cadrage (coûteux, rare)
  pm_sonnet: claude-sonnet-4-6     # Phase 3 : raffinement (mode croisière)
  agent_auditor: claude-sonnet-4-6 # Architecte (phases 2, 5, 9) + Sécu (phase 8)
  # Back, Front, Test — cascade de modèles locaux (ADR 0006, révision
  # 2026-08-05), pas un modèle unique : le modèle change entre chaque
  # ACTIVATION COMPLÈTE d'un agent (studio.routing.model_for_attempt), pas
  # au sein de la boucle de correction ciblée (inner_retry_limit).
  # Constaté en run réel (todolist3, gestion-taches) : qwen2.5:7b puis
  # qwen2.5:14b ont produit trois fois le MÊME bug de syntaxe périmée
  # (pydantic v1, SQLAlchemy sync) sans converger — un modèle qui régénère
  # depuis les mêmes connaissances d'entraînement ne "réessaie" pas
  # différemment de lui-même. Ordre du moins cher (gratuit, rapide) au plus
  # capable, cohérent avec le principe coût-d'abord de l'ADR : qwen2.5:7b
  # d'abord (beaucoup de tâches simples réussissent dès ce niveau), puis
  # qwen2.5:14b, puis devstral:24b (spécialisé code agentique/SWE), puis
  # gpt-oss:20b en dernier recours. Chaîne au-delà de 3 modèles => agents.
  # max_iterations doit couvrir toute la cascade (voir plus bas), sinon les
  # derniers modèles ne sont jamais atteints.
  # Ordre 2026-08-06 : le plus efficace en théorie en premier (Devstral est
  # spécialisé code/agentique, gpt-oss:20b généraliste fort ensuite), les
  # deux Qwen en filet de secours — cascade + reset-on-retry (voir
  # routing.agent_iteration_count) repart toujours à l'index 0 à chaque
  # nouvel essai, donc l'ordre détermine directement quel modèle est
  # réellement essayé en premier à chaque retry, pas seulement en 1ère
  # activation.
  agents_local:
    - devstral:24b
    - gpt-oss:20b
    - qwen2.5:14b-instruct
    - qwen2.5:7b-instruct
  devaimazing: gemma3:4b            # Agent Devaimazing (ADR 0013), validé 2026-07-29

# Ollama
ollama:
  base_url: http://localhost:11434
  timeout_seconds: 600
  max_retries: 3
  # Fenêtre de contexte (tokens) passée à Ollama via options.num_ctx. Sans ce
  # réglage, Ollama tronque silencieusement à son défaut (2048) — augmenter si
  # les logs de trace montrent tokens_prompt collé à num_ctx alors que
  # prompt_chars grossit (feedback tronqué, voir docs/roadmap.md 2026-07-16).
  # Relevé à 32768 le 2026-07-19 (run-20260714-205712, todo-list) : le
  # feedback cumulé de back a fait grimper tokens_prompt de 4537 à 8950 sur
  # 11 tours consécutifs (croissance ~400-500 tokens/tour) — 16384 restait
  # suffisant sur ce run mais la tendance annonçait un dépassement à terme.
  # 32768 = context_length natif de qwen2.5:7b-instruct (voir `ollama show`) :
  # plafond du modèle, pas de marge artificielle en-deçà.
  num_ctx: 32768

# Agent Devaimazing (ADR 0013). num_ctx séparé de ollama.num_ctx ci-dessus :
# ce dernier est calibré pour le prompt Back/Front/Test (feedback cumulé,
# voir commentaire ci-dessus), pas pour le prompt Devaimazing (persona +
# outils), plus court — valeur testée empiriquement le 2026-07-29 (voir
# docs/roadmap.md).
devaimazing:
  num_ctx: 4096

# Claude Code CLI
claude_code:
  timeout_seconds: 300
  output_format: json

# SAST (phase 8, avant agent Sécu)
sast:
  enabled: true
  tools:
    - name: bandit
      command: bandit -r {target_dir} -f json
    - name: semgrep
      command: semgrep --config=auto {target_dir} --json
  fail_on_severity: HIGH  # CRITICAL et HIGH bloquent, les autres sont signalés

# Checkpoints de validation humaine
checkpoints:
  phase_1_cadrage: true
  phase_2_audit_amont: true
  phase_3_fiches: true
  phase_5_audit_stubs: true
  phase_9_audit_aval: true

# Retry agents
agents:
  # Aligné sur la longueur de la cascade models.agents_local (4 modèles,
  # voir plus haut) — sinon le dernier maillon de la cascade
  # (qwen2.5:7b-instruct) ne serait jamais atteint (routing.model_for_attempt
  # indexe la cascade par le nombre d'activations déjà tentées).
  max_iterations: 4
  retry_delay_seconds: 5
  # Tentatives de correction ciblée DANS une même activation d'un agent
  # producteur (Back/Front/Test), après un échec de tools.pyenv.verify_python_files
  # (syntaxe/import) — distinct de max_iterations, qui borne les activations
  # complètes successives (nouvelle lecture de fiche, nouvel appel outer via
  # le graphe). But : transformer plusieurs échecs WAITING_HUMAN en un seul,
  # en corrigeant immédiatement dans le même tour (voir docs/roadmap.md,
  # 2026-07-20). Ne couvre que ce que verify_python_files détecte
  # (syntaxe/import) — pas les écarts sémantiques avec la fiche.
  inner_retry_limit: 3

# Métriques
metrics:
  db_path: ~/.devaimazing/metrics.db
  prometheus_port: 9091
  export_interval_seconds: 15

# State LangGraph
state:
  db_path: ~/.devaimazing/state.db

# Git
git:
  commit_prefix_convention: true  # Conventional commits (feat:, fix:, docs:, etc.)
  sign_commits: false             # GPG signing (activer si clé disponible)
  base_branch: develop
  branch_prefix: studio/          # studio/<slug-feature>-<hash5>
  commit_per_task: true           # commit à la fin de chaque tâche d'agent, pas seulement en phase 10

# Notifications (ntfy)
notifications:
  provider: ntfy
  ntfy:
    server_url: https://ntfy.sh
    topic: <PLACEHOLDER_TOPIC>    # à remplacer par un topic unique et non devinable
  no_link_in_message: true        # message auto-suffisant, pas de lien
  notify_on:
    - agent_failure
    - checkpoint_pending
    - run_completed

# Interface Telegram (ADR 0013, socle uniquement — bot pas encore implémenté,
# voir docs/roadmap.md). Token et chat_id réels dans config/local.yml
# (gitignoré), jamais ici — même traitement que notifications.ntfy.topic
# ci-dessus.
telegram:
  token: <PLACEHOLDER_TELEGRAM_TOKEN>
  allowed_chat_id: <PLACEHOLDER_CHAT_ID>  # mono-utilisateur, tout autre chat_id est ignoré
  general_topic_alias: "General"

# Transcription vocale (ADR 0014) - whisper.cpp local, voir infra/whisper/.
# base_url pointe sur whisper-server (port hôte 8090, distinct d'Ollama
# 11434). language forcée : usage mono-utilisateur francophone (pas
# d'auto-détection, voir ADR 0014).
whisper:
  base_url: http://localhost:8090
  language: fr

# Logging
logging:
  level: INFO
  format: json
  file: ~/.devaimazing/studio.log
