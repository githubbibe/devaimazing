services:
  whisper:
    image: ghcr.io/ggerganov/whisper.cpp:main
    platform: linux/amd64  # image officielle amd64-only (pas de build arm64/v8 publié,
                            # vérifié via `podman manifest inspect` le 2026-07-29) —
                            # tourne en émulation QEMU sur Apple Silicon.
    container_name: whisper
    restart: unless-stopped
    entrypoint: /app/build/bin/whisper-server
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --model
      - /models/${WHISPER_MODEL:-ggml-small.bin}
      - --convert
      - --language
      - fr
    ports:
      - "8090:8080"
    volumes:
      - ${WHISPER_DATA_DIR:?Définir WHISPER_DATA_DIR dans infra/whisper/.env (copier .env.example) — chemin sur une partition à gros quota, ex. /goinfre/<user>/Whisper}:/models
